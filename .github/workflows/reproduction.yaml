name: Reproduction
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - parallel:
          - uses: $/.github/actions/setup-a
          - uses: $/.github/actions/setup-b
